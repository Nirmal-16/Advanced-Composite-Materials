<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ACM | About Us</title>
  <meta name="description" content="Leading research in computational multiphysics with a commitment to innovation, collaboration, and open science." />
  <meta property="og:title" content="ACM | About Us" />
  <meta property="og:description" content="Leading research in computational multiphysics with a commitment to innovation, collaboration, and open science." />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Advanced Composite Materials Lab" />

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="./assets/css/about.css" />
  <link rel="stylesheet" href="./assets/css/style.css" />
  <link rel="stylesheet" href="./assets/css/navbar.css" />
  <link rel="stylesheet" href="./assets/css/card.css" />
  <link rel="stylesheet" href="./assets/css/footer.css" />
</head>

<body>
  <div id="navbar-placeholder"></div>

  <!-- ── Hero ── -->
  <div class="about-hero text-center reveal">
    <h1 id="aboutTitle"></h1>
    <p id="aboutSubtitle"></p>
  </div>

  <!-- ── Mission / Vision ── -->
  <section class="container py-5 reveal">
    <div class="text-card-div row g-4">
      <div class="text-card col-md-5">
        <h3>Mission</h3>
        <p id="missionText"></p>
      </div>
      <div class="text-card col-md-5">
        <h3>Vision</h3>
        <p id="visionText"></p>
      </div>
    </div>
  </section>

  <!-- ── What Sets Us Apart ── -->
  <section class="bg-light py-5 text-center reveal">
    <div class="container">
      <h2>What Sets Us Apart</h2>
      <p class="text-muted">Our commitment to excellence and innovation guides everything we do</p>
      <div id="servicesContainer" class="services-container text-start">
        <div class="card skeleton-block" aria-hidden="true"></div>
        <div class="card skeleton-block" aria-hidden="true"></div>
        <div class="card skeleton-block" aria-hidden="true"></div>
        <div class="card skeleton-block" aria-hidden="true"></div>
      </div>
    </div>
  </section>

  <!-- ── Founder ── -->
  <section class="container py-5 text-center reveal">
    <h2>Founder</h2>
    <p class="text-muted">Talented researchers dedicated to pushing boundaries</p>
    <div id="founderGrid">
      <div class="founderinnerGrid">
        <div class="founder-card text-center" aria-hidden="true">
          <div class="founder-avatar skeleton-block"></div>
          <div class="skeleton-line w-40 mx-auto"></div>
          <div class="skeleton-line w-60 mx-auto"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- ── Stats ── -->
  <section class="stats-bar reveal">
    <div id="statsGrid" class="container">
      <div class="row g-4" aria-hidden="true">
        <div class="col-6 col-md-3"><div class="skeleton-line w-60 mx-auto"></div></div>
        <div class="col-6 col-md-3"><div class="skeleton-line w-60 mx-auto"></div></div>
        <div class="col-6 col-md-3"><div class="skeleton-line w-60 mx-auto"></div></div>
        <div class="col-6 col-md-3"><div class="skeleton-line w-60 mx-auto"></div></div>
      </div>
    </div>
  </section>

  <!-- ── Education ── -->
  <section class="container py-5 reveal">
    <h2 class="mb-4">Education</h2>
    <div id="educationList" class="row g-4">
      <div class="col-md-6" aria-hidden="true"><div class="feature-card edu-card skeleton-block"><div class="institution-logo edu-logo skeleton-block"></div></div></div>
      <div class="col-md-6" aria-hidden="true"><div class="feature-card edu-card skeleton-block"><div class="institution-logo edu-logo skeleton-block"></div></div></div>
      <div class="col-md-6" aria-hidden="true"><div class="feature-card edu-card skeleton-block"><div class="institution-logo edu-logo skeleton-block"></div></div></div>
      <div class="col-md-6" aria-hidden="true"><div class="feature-card edu-card skeleton-block"><div class="institution-logo edu-logo skeleton-block"></div></div></div>
    </div>
  </section>

  <!-- ── Experience ── -->
  <section class="bg-light py-5 reveal">
    <div class="container">
      <h2 class="mb-4">Experience</h2>
      <div id="experienceTimeline">
        <div class="mb-4 ps-4 border-3 border-start border-info" aria-hidden="true">
          <div class="experience-row">
            <div class="institution-logo skeleton-block"></div>
            <div class="experience-content">
              <div class="skeleton-line w-40"></div>
              <div class="skeleton-line w-90"></div>
            </div>
          </div>
        </div>
        <div class="mb-4 ps-4 border-3 border-start border-info" aria-hidden="true">
          <div class="experience-row">
            <div class="institution-logo skeleton-block"></div>
            <div class="experience-content">
              <div class="skeleton-line w-40"></div>
              <div class="skeleton-line w-90"></div>
            </div>
          </div>
        </div>
        <div class="mb-4 ps-4 border-3 border-start border-info" aria-hidden="true">
          <div class="experience-row">
            <div class="institution-logo skeleton-block"></div>
            <div class="experience-content">
              <div class="skeleton-line w-40"></div>
              <div class="skeleton-line w-90"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- ── Journal Publications ── -->
  <section class="container py-5 reveal">
    <h2 class="mb-4">Journal Publications</h2>
    <div class="table-responsive">
      <table class="table table-striped">
        <thead class="table-light">
          <tr>
            <th>Journal</th>
            <th>Publications</th>
          </tr>
        </thead>
        <tbody id="journalsTable">
          <tr><td><div class="skeleton-line w-70"></div></td><td><div class="skeleton-line w-40"></div></td></tr>
          <tr><td><div class="skeleton-line w-70"></div></td><td><div class="skeleton-line w-40"></div></td></tr>
          <tr><td><div class="skeleton-line w-70"></div></td><td><div class="skeleton-line w-40"></div></td></tr>
        </tbody>
      </table>
    </div>
  </section>

  <!-- ── Professional Memberships ── -->
  <section class="bg-light py-5 reveal">
    <div class="container">
      <h2 class="mb-4">Professional Memberships</h2>
      <ul id="membershipList" class="list-group list-group-flush">
        <li class="list-group-item"><div class="skeleton-line w-40"></div></li>
        <li class="list-group-item"><div class="skeleton-line w-40"></div></li>
        <li class="list-group-item"><div class="skeleton-line w-40"></div></li>
      </ul>
    </div>
  </section>

  <!-- ── Awards ── -->
  <section class="container py-5 reveal">
    <h2 class="mb-4">Awards & Achievements</h2>
    <div id="awardsGrid" class="row g-4">
      <div class="col-sm-6 col-md-4" aria-hidden="true"><div class="feature-card skeleton-block"></div></div>
      <div class="col-sm-6 col-md-4" aria-hidden="true"><div class="feature-card skeleton-block"></div></div>
      <div class="col-sm-6 col-md-4" aria-hidden="true"><div class="feature-card skeleton-block"></div></div>
    </div>
  </section>

  <footer id="footer-placeholder"></footer>

  <script type="module" src="./assets/js/app.js"></script>

  <script type="module">
    import { createCard } from "./components/card.js";

    const BASE_PATH = window.location.hostname.includes("github.io")
      ? "/Advanced-Composite-Materials"
      : ".";

    function institutionLogo(item, altName) {
      return item.logo
        ? `<img src="${item.logo}" alt="${altName}">`
        : (item.logoInitials || altName.charAt(0));
    }

    const els = {
      title:       document.getElementById("aboutTitle"),
      subtitle:    document.getElementById("aboutSubtitle"),
      mission:     document.getElementById("missionText"),
      vision:      document.getElementById("visionText"),
      services:    document.getElementById("servicesContainer"),
      founder:     document.getElementById("founderGrid"),
      stats:       document.getElementById("statsGrid"),
      education:   document.getElementById("educationList"),
      experience:  document.getElementById("experienceTimeline"),
      journals:    document.getElementById("journalsTable"),
      memberships: document.getElementById("membershipList"),
      awards:      document.getElementById("awardsGrid")
    };

    fetch(`${BASE_PATH}/data/about.json`)
      .then(res => res.json())
      .then(data => {

        els.title.textContent    = data.title;
        els.subtitle.textContent = data.subtitle;
        els.mission.textContent  = data.mission;
        els.vision.textContent   = data.vision;

        els.services.innerHTML = data.features
          .map(service => createCard(service))
          .join("");

        els.founder.innerHTML = data.founder
          .map(t => `
            <div class="col-md-4 founderinnerGrid">
              <div class="founder-card text-center">
                <div class="founder-avatar">${t.initial}</div>
                <h5 class="mt-3">${t.name}</h5>
                <p class="text-dark">${t.role}</p>
                <p class="text-muted">${t.bio}</p>
                <button class="d-block founder-btn">View CV</button>
                <button class="d-block founder-btn founder-btn1 highlight contact-btn">Get Connect</button>
              </div>
            </div>`)
          .join("");

        els.stats.innerHTML = `
          <div class="row g-4">
            ${data.stats.map(s => `
              <div class="col-6 col-md-3">
                <div class="stats-item">
                  ${s.value}<span>${s.label}</span>
                </div>
              </div>`).join("")}
          </div>`;

        els.education.innerHTML = data.education
          .map(e => `
            <div class="col-md-6">
              <div class="feature-card edu-card">
                <div class="institution-logo edu-logo">${institutionLogo(e, e.institution)}</div>
                <h5 style="font-weight: 1000;">${e.degree}</h5>
                <p class="text-muted">${e.institution} • ${e.year}</p>
                <small>${e.details}</small>
              </div>
            </div>`)
          .join("");

        els.experience.innerHTML = data.experience
          .map(x => `
            <div class="mb-4 ps-4 border-3 border-start border-info">
              <div class="experience-row">
                <div class="institution-logo">${institutionLogo(x, x.org)}</div>
                <div class="experience-content">
                  <h5 style="font-weight: 1000;">${x.role} – ${x.org}</h5>
                  <small class="text-muted">${x.period}</small>
                  <p>${x.desc}</p>
                </div>
              </div>
            </div>`)
          .join("");

        els.journals.innerHTML = data.journals
          .map(j => `
            <tr>
              <td>${j.title}</td>
              <td>${j.count}</td>
            </tr>`)
          .join("");

        els.memberships.innerHTML = data.memberships
          .map(m => `<li class="list-group-item">${m}</li>`)
          .join("");

        els.awards.innerHTML = data.awards
          .map(a => `
            <div class="col-sm-6 col-md-4">
              <div class="feature-card text-center">
                <h5 style="font-weight: 1000;">${a.title}</h5>
                <p class="text-muted">${a.year}</p>
              </div>
            </div>`)
          .join("");

        // Structured data — built from the same live data, so it stays in sync
        const founder = data.founder && data.founder[0];
        if (founder) {
          const ld = document.createElement("script");
          ld.type = "application/ld+json";
          ld.textContent = JSON.stringify({
            "@context": "https://schema.org",
            "@type": "Person",
            "name": founder.name,
            "jobTitle": founder.role,
            "description": founder.bio,
            "worksFor": {
              "@type": "Organization",
              "name": "Advanced Composite Materials Lab"
            },
            "affiliation": data.experience && data.experience[0] ? data.experience[0].org : undefined
          });
          document.head.appendChild(ld);
        }
      });
  </script>
</body>
</html>
